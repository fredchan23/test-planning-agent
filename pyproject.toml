[project]
name = "test-planning-agent"
version = "0.1.0"
description = "Agentic Test-Planning Agent using ADK 2.0"
authors = [
    {name = "Hackathon Developer", email = "dev@hackathon.org"},
]
dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "aiohttp>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
]
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.158.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test_planner_agent"]
